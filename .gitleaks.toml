# Default gitleaks rules plus the environment host names this public repository must not carry.
# Keep the regexes in sync with .github/scripts/check-hostnames.sh.
[extend]
useDefault = true

[[rules]]
id = "cls-dashboard-host"
description = "Cloud Logging Service host with a subscription UUID"
regex = '''(?i)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[a-z0-9.-]*\.cloud\.sap'''
keywords = ["cloud.sap"]

[[rules]]
id = "ccv2-environment-host"
description = "CCv2 endpoint with a subscription code"
regex = '''(?i)[a-z0-9]+-[a-z0-9]+-[dsp][0-9]+-public\.model-t\.cc\.commerce\.ondemand\.com'''
keywords = ["ondemand.com"]
