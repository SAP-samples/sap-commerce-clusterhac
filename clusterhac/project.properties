clusterhac.key=value

# Specifies the location of the spring context file putted automatically to the global platform application context.
clusterhac.application-context=clusterhac-spring.xml
# Uncomment Below for local testing
#cluster.node.groups = backoffice
# Update the CLS URL
# e.g https://dashboards-<subscription>.<region>.cls.services.cloud.sap
#ccv2.services.logging = https://dashboards-<subscription>.<region>.cls.services.cloud.sap

# Cache Monitoring: promote up to 5 additional cache regions to their own sub-tab (shown between
# the Query and Other regions tabs). Comma-separated region names; entries beyond 5 are dropped and
# unknown names are skipped (with a WARN in the log). Leave commented to keep the default tabs only.
# e.g. clusterhac.cache.pinnedRegions=cmsCacheRegion,productCacheRegion
#clusterhac.cache.pinnedRegions=

# Heap Dump tab: the Azure Blob Storage account the heap dump is streamed to. Required before the
# tab can trigger a dump (otherwise the UI shows a warning and /trigger is rejected). When left
# blank (or unset), the extension falls back at runtime to the CCv2 hotfolder storage account
# (azure.hotfolder.storage.account.connection-string). Set this only to stream to a dedicated
# account. NOTE: the connection string contains the account key and is readable from HAC's own
# Configuration tab.
#clusterhac.heapdump.azure.connection-string=
# Container the heap-dump blobs are written to (created if missing). Blobs are placed under a
# per-host virtual folder as <host>/<host>_<user>_<timestamp>.hprof[.gz]. Default: memory-dump-container
#clusterhac.heapdump.azure.container=memory-dump-container
# Gzip compression level for the dump (1=fastest .. 9=strongest, 0=off). Default: 1
#clusterhac.heapdump.gzip=1

