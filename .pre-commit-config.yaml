# Optional local hooks; the same checks run in CI on every pull request.
# Enable with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: local
    hooks:
      - id: no-environment-hostnames
        name: no environment hostnames
        entry: .github/scripts/check-hostnames.sh
        language: script
        pass_filenames: false
